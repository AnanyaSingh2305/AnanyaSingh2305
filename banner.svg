  </path>
  <text x="600" y="148" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800">Ananya Singh</text>
  <text x="600" y="199" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Software Engineer | AI/ML Enthusiast | Full-Stack Developer</text>
