  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c5b9f8"/><stop offset="1" stop-color="#a3e6fa"/></linearGradient>
  <clipPath id="frame"><rect width="1200" height="340"/></clipPath>
 </defs>
 <g clip-path="url(#frame)">
